    <script src="lang.js" charset="utf-8"></script>
    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                // Ignore page transitions for external links (target="_blank" or mailto:)
                if (this.hostname === window.location.hostname && this.target !== '_blank' && !this.href.startsWith('mailto:')) {
                    e.preventDefault();
                    let target = this.href;
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = target; }, 350);
                }
            });
        });
    </script>
